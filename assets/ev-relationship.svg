<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Conceptual diagram of how cells, holders, enclosure and cover relate"><title>Conceptual diagram of how cells, holders, enclosure and cover relate</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6f0ed"/></linearGradient><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#eef3f5"/><stop offset=".5" stop-color="#b8c8d0"/><stop offset="1" stop-color="#6d8592"/></linearGradient><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c4d6d0" stroke-width=".6" opacity=".6"/></pattern><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#0b8f68"/></marker></defs><rect width="960" height="600" fill="url(#bg)"/><rect width="960" height="600" fill="url(#g)"/><text x="300" y="70" font-family="Arial,sans-serif" font-size="20" fill="#1f2d3a" text-anchor="middle" font-weight="700" letter-spacing="0">How the components relate</text><rect x="80" y="110" width="440" height="60" rx="14" fill="#e6f2f8" stroke="#2f7fd1" stroke-width="1.4"/><text x="300" y="147" font-family="Arial,sans-serif" font-size="15" fill="#1f2d3a" text-anchor="middle" font-weight="700" letter-spacing="0">Cover — closes and protects the enclosure</text><rect x="60" y="200" width="480" height="330" rx="20" fill="#fff" stroke="#0b8f68" stroke-width="2"/><text x="300" y="232" font-family="Arial,sans-serif" font-size="14" fill="#1f2d3a" text-anchor="middle" font-weight="700" letter-spacing="0">Sheet metal enclosure — mounting, support, assembly access</text><rect x="95" y="255" width="410" height="235" rx="16" fill="#e3f6ef" stroke="#0b8f68" stroke-width="1.4" stroke-dasharray="6 4"/><text x="300" y="282" font-family="Arial,sans-serif" font-size="14" fill="#1f2d3a" text-anchor="middle" font-weight="700" letter-spacing="0">Battery holder — locates and spaces the cells</text><circle cx="135" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="135" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="190" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="190" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="245" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="245" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="300" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="300" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="355" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="355" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="410" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="410" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="465" cy="340" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="465" cy="340" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="135" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="135" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="190" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="190" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="245" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="245" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="300" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="300" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="355" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="355" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="410" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="410" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><circle cx="465" cy="420" r="21" fill="url(#cg)" stroke="#1f2d3a" stroke-width="1.2"/><circle cx="465" cy="420" r="8" fill="#e08a3c" stroke="#1f2d3a" stroke-width=".8"/><text x="300" y="468" font-family="Arial,sans-serif" font-size="13" fill="#52635e" text-anchor="middle" font-weight="700" letter-spacing="0">Cells — two rows</text><rect x="600" y="130" width="310" height="92" rx="14" fill="#fff" stroke="#0b8f68" stroke-width="1.4"/><text x="620" y="160" font-family="Arial,sans-serif" font-size="16" fill="#0b8f68" text-anchor="start" font-weight="700" letter-spacing="0">1  Cells</text><text x="620" y="185" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">Energy storage elements arranged for</text><text x="620" y="203" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">space utilization</text><rect x="600" y="238" width="310" height="92" rx="14" fill="#fff" stroke="#0b8f68" stroke-width="1.4"/><text x="620" y="268" font-family="Arial,sans-serif" font-size="16" fill="#0b8f68" text-anchor="start" font-weight="700" letter-spacing="0">2  Holder</text><text x="620" y="293" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">Spacing, support and positioning of</text><text x="620" y="311" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">each cell</text><rect x="600" y="346" width="310" height="92" rx="14" fill="#fff" stroke="#0b8f68" stroke-width="1.4"/><text x="620" y="376" font-family="Arial,sans-serif" font-size="16" fill="#0b8f68" text-anchor="start" font-weight="700" letter-spacing="0">3  Enclosure</text><text x="620" y="401" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">Sheet metal structure, mounting and</text><text x="620" y="419" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">serviceability</text><rect x="600" y="454" width="310" height="92" rx="14" fill="#fff" stroke="#0b8f68" stroke-width="1.4"/><text x="620" y="484" font-family="Arial,sans-serif" font-size="16" fill="#0b8f68" text-anchor="start" font-weight="700" letter-spacing="0">4  Cover</text><text x="620" y="509" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">Closes the enclosure; assembly and a</text><text x="620" y="527" font-family="Arial,sans-serif" font-size="12.5" fill="#1f2d3a" text-anchor="start" font-weight="400" letter-spacing="0">ccess considerations</text><text x="480" y="578" font-family="Arial,sans-serif" font-size="13" fill="#52635e" text-anchor="middle" font-weight="400" letter-spacing="0">Relationship between cells, holders, enclosure and cover (conceptual)</text><g font-family="Arial,sans-serif"><rect x="20" y="18" rx="13" width="132" height="26" fill="#10201c"/><text x="86" y="36" font-size="11.5" font-weight="700" fill="#8fe9c8" text-anchor="middle" letter-spacing="1.6">ILLUSTRATIVE</text></g></svg>